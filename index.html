<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Surprise for DM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      animation: fadeIn 2s ease-out;
      color: #fff;
    }
    .container {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 650px;
      width: 90%;
      backdrop-filter: blur(5px);
      transform: scale(0.9);
      animation: scaleUp 1s ease-out forwards;
    }
    h1 {
      font-size: 2.5rem;
      color: #fff;
      margin-bottom: 20px;
      animation: bounceIn 1s ease-out;
    }
    .message {
      font-size: 1.2rem;
      color: #fff;
      margin: 20px 0;
      line-height: 1.6;
      opacity: 0;
      animation: fadeInMessage 2s ease-in forwards;
    }
    .highlight {
      font-weight: bold;
      color: #ffeb3b;
    }
    .confetti {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
    .confetti div {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #fff;
      animation: confettiFall 3s infinite linear;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleUp {
      from { transform: scale(0.9); }
      to { transform: scale(1); }
    }
    @keyframes bounceIn {
      0% { transform: translateY(-100%); }
      60% { transform: translateY(30%); }
      80% { transform: translateY(-10%); }
      100% { transform: translateY(0); }
    }
    @keyframes fadeInMessage {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes confettiFall {
      0% { top: -10px; left: 50%; }
      100% { top: 100vh; left: random; }
    }
    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        width: 80%;
      }
      h1 {
        font-size: 2rem;
      }
      .message {
        font-size: 1rem;
      }
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }
      .message {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="confetti" id="confetti"></div>

  <div class="container">
    <h1>Happy Birthday, Amina!</h1>
    <div class="message" id="birthdayMessage"></div>
  </div>

  <script>
    // Set DM's birthday
    const birthday = new Date('2025-03-27'); // Change this date as needed
    const today = new Date();

    // Generate confetti effect
    function createConfetti() {
      const confettiContainer = document.getElementById('confetti');
      for (let i = 0; i < 150; i++) {
        const confettiPiece = document.createElement('div');
        confettiPiece.style.left = `${Math.random() * 100}%`;
        confettiPiece.style.animationDuration = `${Math.random() * 5 + 2}s`;
        confettiPiece.style.animationDelay = `${Math.random() * 3}s`;
        confettiContainer.appendChild(confettiPiece);
      }
    }

    // Function to display the birthday message
    function birthdayMessage() {
      const messageElement = document.getElementById('birthdayMessage');

      if (today.toDateString() === birthday.toDateString()) {
        messageElement.innerHTML = `
          <p>🎉<span class="highlight">Amina</span>, it's your special day!🎂🎉</p>
          <p>"Happy Birthday, Amina! On this special day, I pray that Allah grants you happiness, peace, and countless blessings.</p>
          <p> May He continue to guide you on the path of righteousness, and fill your heart with joy and contentment. </p>
          <p>Your strength, grace, and kindness truly shine, and it’s a blessing to know someone as inspiring as you.</p>
           <p>I hope your day is filled with love and joy, and that this year brings you closer to all the goodness life has to offer.</p>
          <p>  May Allah bless you always."<p>


        `;
        createConfetti();
      } else if (today > birthday) {
        messageElement.innerHTML = `
          <p>Oops! Looks like we missed your special day, <span class="highlight">Amina</span>! 🎂</p>
          <p>But it's never too late to send you all my best wishes. Hope you had a fantastic birthday! 🎉</p>
        `;
      } else {
        messageElement.innerHTML = `
          <p>Your birthday is almost here, <span class="highlight">Amina</span>! 🎈🎉</p>
          <p>Counting down the days until we celebrate! Wishing you all the happiness in the world! 💖</p>
        `;
      }
    }

    // Call the function to display the message on load
    window.onload = function() {
      birthdayMessage();
    };
  </script>

</body>
</html>
